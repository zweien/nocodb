# Builds the NocoDB SSO-CE Docker image from the fork and pushes it to ghcr.io.
#
# This workflow restores the build chain NocoDB removed in PR #13244
# (Dockerfile.timely + rspack.timely.config.js + pnpm bootstrap). It runs on
# GitHub's CI runners where the full npm/docker registries are reachable.
#
# Trigger: manual (Actions tab → "Run workflow"), or push to develop-sso-ce.
#
# After it succeeds, pull the image locally:
#   docker pull ghcr.io/zweien/nocodb-sso-ce:latest
#
# Auth: the built-in GITHUB_TOKEN has package:write permission (configured
# below via `permissions:`). No extra secrets needed for ghcr.io.

name: Build SSO-CE Image

on:
  workflow_dispatch:
  push:
    branches: [develop-sso-ce]
    paths:
      - 'packages/nocodb/src/modules/sso-ce/**'
      - 'packages/nocodb/Dockerfile.timely'
      - 'packages/nocodb/rspack.timely.config.js'
      - '.github/workflows/build-sso-image.yml'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nocodb-sso-ce

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Bootstrap (install + build sdk + integrations)
        # CI's pnpm defaults to --frozen-lockfile, but the fork's lockfile may
        # drift from package.json (e.g. when overrides change). Use
        # --no-frozen-lockfile to let pnpm reconcile. Also disable
        # verifyDepsBeforeRun which otherwise re-runs nc-gui's postinstall on
        # every pnpm script invocation and hits a circular dep on nocodb-sdk.
        # The nocodb-sdk tsconfig's "types": ["jest"] requires @types/jest
        # which isn't always resolvable in the pruned tree — strip it.
        run: |
          pnpm config set verifyDepsBeforeRun false
          pnpm install --no-frozen-lockfile
          # nocodb-sdk: drop jest types (test-only, @types/jest not always
          # resolvable), generate swagger, then build BOTH main (CJS) and
          # module (ESM) — nc-gui's vite reads package.json's "module" field
          # which points to build/module/index.js; missing it fails nc-gui
          # build with "Failed to resolve entry for package nocodb-sdk".
          sed -i '/"types": \["jest"\],/d' packages/nocodb-sdk/tsconfig.json
          pnpm --filter=nocodb-sdk run generate:sdk
          pnpm --filter=nocodb-sdk run build:main
          pnpm --filter=nocodb-sdk run build:module
          # integrations: may fail on undeclared deps (axios, ipaddr.js) — install + retry
          (cd packages/noco-integrations/core && pnpm add axios ipaddr.js 2>/dev/null || true)
          pnpm run integrations:build || true
          pnpm run registerIntegrations || true
          # nocodb: install deps that src imports but package.json doesn't
          # declare (rspack with nodeExternals still needs them resolvable at
          # build time for require() calls). Without these, rspack fails with
          # "Module not found: Can't resolve 'oracledb'/'image-size/fromFile'".
          pnpm --filter=nocodb add @sentry/node node-machine-id image-size ipaddr.js minimatch moment oracledb

      - name: Build nc-gui (frontend)
        run: |
          # nc-gui's build command changed across versions — try generate, then build, then nuxi generate
          cd packages/nc-gui
          pnpm run generate 2>/dev/null || pnpm run build 2>/dev/null || pnpm exec nuxi generate
          # Copy the frontend into the backend's docker/nc-gui/ so Dockerfile.timely can pick it up
          mkdir -p ../nocodb/docker/nc-gui
          rsync -a --delete ./dist/ ../nocodb/docker/nc-gui/ 2>/dev/null || \
            rsync -a --delete ./.output/public/ ../nocodb/docker/nc-gui/ 2>/dev/null || \
            echo "WARN: could not locate nc-gui build output"

      - name: Build nocodb bundle (rspack timely config)
        run: |
          cd packages/nocodb
          EE=true pnpm exec rspack --config rspack.timely.config.js
          # nocodb-sdk is bundled into docker/main.js by rspack (allowlist),
          # so remove the workspace reference before the docker build resolves deps.
          pnpm uninstall --save-prod nocodb-sdk || node -e "const p=require('./package.json'); delete p.dependencies['nocodb-sdk']; require('fs').writeFileSync('./package.json', JSON.stringify(p,null,2))"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: packages/nocodb
          file: packages/nocodb/Dockerfile.timely
          # Single-platform for the fork — we only need to test locally.
          # If you need multi-arch, restore the platforms line and QEMU setup
          # from the upstream release-timely-docker.yml.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: NC_VERSION=${{ github.sha }}
